spring:
  application:
    name: payment-gateway
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8090

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

payment:
  supported-currencies: EUR, GBP, USD

acquiring-bank:
  url: http://localhost:8080/payments

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

resilience4j:
  retry:
    instances:
      acquiringBank:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.checkout.payment.gateway.exception.BankUnavailableException
        ignore-exceptions:
          - com.checkout.payment.gateway.exception.BankTimeoutException